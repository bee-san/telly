# Checks every push to main, and every pull request: the frontend's types,
# tests and build, and the backend's tests. Telly has no review gate, so this
# is what says a commit on main broke something.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # On Windows, which Telly ships for: the tests' paths are Windows' (D:\Anime\...).
  backend:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Pinned as the release's is (release.yml says why).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's build reads the frontend's folder; the tests don't need what's in it.
      - run: mkdir build
        shell: bash

      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      # The measuring examples aren't run, but they should still build.
      - run: cargo check --manifest-path src-tauri/Cargo.toml --examples --locked
