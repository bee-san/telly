# Checks the backend on every push to main that changes it: its tests, and
# that the measuring examples still build. Telly has no review gate, so this
# is what says a commit on main broke something. The frontend's checks are
# in frontend.yml. Pushes that change neither (the manual, the README) run
# nothing, since Windows runners' minutes count double.

name: Checks

on:
  push:
    branches: [main]
    paths:
      - src-tauri/**
      - .github/workflows/checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On Windows, which Telly ships for: the tests' paths are Windows' (D:\Anime\...).
  backend:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Pinned as the release's is (release.yml says why).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's build reads the frontend's folder; the tests don't need what's in it.
      - run: mkdir build
        shell: bash

      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      # The measuring examples aren't run, but they should still build.
      - run: cargo check --manifest-path src-tauri/Cargo.toml --examples --locked
