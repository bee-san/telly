# Builds Telly's Windows installer and Android APK for each release and
# attaches them.
#
# Publish a release whose tag is the app's version with a v before it
# (v0.1.0 for 0.1.0, as in src-tauri/tauri.conf.json): this builds
# Telly_<version>_x64-setup.exe with `npm run release` and
# Telly_<version>_android.apk with `tauri android build`, and adds them to the
# release, where Telly on the PC and on the phone find them. Run it by hand
# (Actions → Release → Run workflow) to build them without a release; they're
# kept with the run, under Artifacts.
#
# The APK is signed with the key in these repository secrets, the one your
# phone's Telly is signed with, so Android lets it update in place:
# ANDROID_KEYSTORE (the .jks file, base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Pinned: Rust 1.100's cargo puts build scripts' output a folder deeper,
      # and ort-sys 2.0.0-rc.12 (FireRedVAD's ONNX Runtime) then fails copying
      # its DLLs on Windows. Move on once ort is past that.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      # No Rust cache: a release runs on its tag, and GitHub lets a tag's run
      # restore only its own caches or main's. Main's are the tests' debug
      # builds, so restoring one and saving another (2 to 3 minutes) gained
      # nothing.

      - name: The release's tag is the app's version
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::The release is tagged $TAG, but src-tauri/tauri.conf.json says $version. Tag it v$version, or change the version first."
            exit 1
          fi

      - run: npm ci

      # Downloads Hachidori, then builds the app and its NSIS installer.
      - run: npm run release

      - name: Keep the installer with the run
        uses: actions/upload-artifact@v7
        with:
          name: telly-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe --clobber

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android

      - name: The release's tag is the app's version
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::The release is tagged $TAG, but src-tauri/tauri.conf.json says $version. Tag it v$version, or change the version first."
            exit 1
          fi

      # The runner has the Android SDK and NDK; Gradle wants JDK 17.
      - name: Android's tools
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: The key the APK is signed with
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            message="Add ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to the repository's secrets: an unsigned APK can't update the phone's Telly."
            # A run by hand still builds one, unsigned, to try.
            if [ "$GITHUB_EVENT_NAME" = "release" ]; then echo "::error::$message"; exit 1; fi
            echo "::warning::$message"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/telly.jks"
          {
            echo "storeFile=$RUNNER_TEMP/telly.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      - run: npm ci

      - name: Clips on cards need FFmpegKit
        shell: bash
        run: ls src-tauri/gen/android/app/libs/*.aar || echo "::warning::No FFmpegKit .aar in src-tauri/gen/android/app/libs, so this APK adds cards without their picture and audio."

      # Downloads Hachidori and copies its dictionary engine, then builds the APK.
      - run: npm run android -- --target aarch64 --apk

      - name: Name the APK for the release
        shell: bash
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -n 1)
          if [ -n "$apk" ]; then
            name="Telly_${version}_android.apk"
          elif [ "$GITHUB_EVENT_NAME" != "release" ]; then
            apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -n 1)
            name="Telly_${version}_android-unsigned.apk"
          fi
          if [ -z "$apk" ]; then
            echo "::error::The build made no signed release APK."
            exit 1
          fi
          mkdir -p dist-android
          cp "$apk" "dist-android/$name"

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v7
        with:
          name: telly-android-apk
          path: dist-android/*.apk
          if-no-files-found: error

      - name: Attach the APK to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist-android/*.apk --clobber
