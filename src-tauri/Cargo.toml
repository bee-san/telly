[package]
name = "telly"
version = "0.15.1"
description = "Telly: an anime player for learning Japanese"
authors = ["bee-san"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "telly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
rusqlite = { version = "0.41.1", features = ["bundled"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip"] }
base64 = "0.22"
tiny_http = "0.12.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "disk"] }
# Lists every network connection by its Windows name, a VPN's tunnel included (sysinfo leaves out what has no hardware address).
network-interface = "2.0.5"
regex = "1"
encoding_rs = "0.8"
percent-encoding = "2.3.2"
# Character portraits for the names dictionary, resized as characterdictionary.tokyo does.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Subtitle sync: alass's aligner, and the WebRTC voice detector alass uses.
alass-core = "2"
webrtc-vad = "0.4"
# Splits Japanese into words for premining (IPADIC, built into the app).
lindera = { version = "6", default-features = false, features = ["embed-ipadic"] }
# Downloads (torrents.rs): Telly's own torrent client, and the runtime it runs on.
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

# FireRedVAD runs on ONNX Runtime, which has no Android build; the phone never syncs subtitles.
[target.'cfg(not(target_os = "android"))'.dependencies]
firered-vad = "0.1.0"

# A second Telly hands over to the first; Android keeps one by itself.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Whether a drive is a hard drive and how much room it has (drives.rs), and the job helper
# programs end with (util.rs) and the box that says why Telly can't open (lib.rs): the version
# Tauri brings already.
# The room left on the phone (phone.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Optimised but quick to rebuild, for the measuring examples (sync_real,
# names_check): cargo run --profile measure --example sync_real -- ...
[profile.measure]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
panic = "unwind"

# The aligner and the voice detector are slow unoptimised, and dev builds sync
# whole episodes.
[profile.dev.package.alass-core]
opt-level = 3
[profile.dev.package.webrtc-vad]
opt-level = 3

[features]
# A small HTTP server that answers the frontend's calls with the real backend,
# so the UI can be driven in a browser (see src/devserver.rs).
devserver = []

[[bin]]
name = "telly-devserver"
path = "src/devserver.rs"
required-features = ["devserver"]
